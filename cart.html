<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Bag — Nyumbani Luxe</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header-mount"></div>

<main class="cart-wrap">
  <p class="eyebrow">Your selections</p>
  <div class="cart-title-row">
    <h1 class="font-display">Your bag<span>.</span></h1>
    <button class="clear-bag hidden" id="clearBagBtn">Clear bag</button>
  </div>

  <div id="cartEmpty" class="cart-empty hidden">
    <h2 class="font-display">A beautiful beginning.</h2>
    <p>Your bag is waiting for something considered.</p>
    <a href="catalogue.html" class="btn btn-dark" style="margin-top:1.75rem;">Explore the collection</a>
  </div>

  <div id="cartLayout" class="cart-layout hidden">
    <div class="cart-items" id="cartItems"></div>
    <aside class="order-summary">
      <h2>Order summary</h2>
      <div class="summary-lines">
        <div class="line"><span class="muted">Subtotal</span><span id="summarySubtotal"></span></div>
        <div class="line"><span class="muted">Delivery</span><span id="summaryDelivery"></span></div>
      </div>
      <div class="summary-total"><span>Total</span><span id="summaryTotal"></span></div>
      <a href="#" class="checkout-btn" id="checkoutBtn">Proceed to checkout</a>
      <p class="summary-note">Secure checkout &middot; Nairobi delivery &middot; M-Pesa &amp; card accepted</p>
    </aside>
  </div>
</main>

<div class="cart-footer">
  <a href="catalogue.html" class="pd-back" style="margin:0;">Back to collection</a>
</div>

<div id="site-footer-mount"></div>

<script src="js/icons.js"></script>
<script src="data/products.js"></script>
<script src="js/toast.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script src="js/cart-page.js"></script>
</body>
</html>
